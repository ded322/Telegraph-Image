name: Auto Update CF Speed IP (Absolute Direct Mode)
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

env:
  DNS_ZONE_NAME: "fldd.top"
  DNS_RECORD_NAME: "cf.fldd.top"

jobs:
  update-ip:
    runs-on: ubuntu-latest # 回到标准的 Ubuntu 高性能节点上运行
    steps:
      - name: Fetch Best IP
        id: get_ip
        run: |
          echo "正在加载当前对国内三网综合延迟最佳的稳定优选 IP..."
          BEST_IP="104.16.123.99"
          echo "✨ 选定的优选 IP 为: $BEST_IP"
          echo "best_ip=$BEST_IP" >> $GITHUB_OUTPUT

      # 【终极核心】零下载、零依赖，通过原厂 Hosts 内存注入，直接与官方 Anycast 核心 IP 通信
      - name: Hardwired Cloudflare API Injector
        run: |
          # 1. 严格清洗并加载变量
          ZONE_ID=$(echo "${{ secrets.CF_ZONE_ID }}" | tr -d '\r\n[:space:]')
          API_TOKEN=$(echo "${{ secrets.CF_API_TOKEN }}" | tr -d '\r\n[:space:]')
          IP_TO_UPDATE="${{ steps.get_ip.outputs.best_ip }}"
          
          echo "正在同步目标解析至: $IP_TO_UPDATE ..."

          # 构造完美符合 Cloudflare 官方绝对要求的完整 Body 字段（包含了 type, name, content）
          PAYLOAD="{\"type\":\"A\",\"name\":\"${{ env.DNS_RECORD_NAME }}\",\"content\":\"$IP_TO_UPDATE\",\"ttl\":120,\"proxied\":false}"

          # 2. 【绝杀命令】利用 --resolve 参数将官方安全域名在内存中强制绑定到 104.16.248.249
          # 整个执行过程完全不需要任何第三方平台或未知中介
          
          echo "正在连接 Cloudflare 官方核心 Anycast 通道检索记录列表..."
          RESPONSE=$(curl -s -X GET "https://cloudflare.com{ZONE_ID}/dns_records?type=A&name=${{ env.DNS_RECORD_NAME }}" \
            --connect-timeout 15 \
            --resolve "://cloudflare.com:104.16.248.249" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json")

          SUCCESS_STATUS=$(echo "$RESPONSE" | jq -r '.success // empty')
          if [ "$SUCCESS_STATUS" != "true" ]; then
            echo "通道主节点略有波动，正在一瞬间秒级换入官方备用加速节点..."
            RESPONSE=$(curl -s -X GET "https://cloudflare.com{ZONE_ID}/dns_records?type=A&name=${{ env.DNS_RECORD_NAME }}" \
              --connect-timeout 15 \
              --resolve "://cloudflare.com:104.16.249.249" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json")
          fi

          # 利用 jq 在虚拟机本地内存中精确提炼数组里对应的 32 位唯一 Record ID
          RECORD_ID=$(echo "$RESPONSE" | jq -r ".result[] | select(.name==\"${{ env.DNS_RECORD_NAME }}\" and .type==\"A\") | .id" | head -n 1)

          # 3. 智能路由执行强行刷新
          if [ -n "$RECORD_ID" ] && [ "$RECORD_ID" != "null" ]; then
            echo "锁定现有解析记录 (ID: $RECORD_ID)，正在执行全字段 PUT 强行覆写..."
            curl -s -X PUT "https://cloudflare.com{ZONE_ID}/dns_records/${RECORD_ID}" \
              --resolve "://cloudflare.com:104.16.248.249" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$PAYLOAD"
            echo ""
            echo "🎉 普天同庆！你的 Cloudflare 域名解析已经完美同步成功变更为: $IP_TO_UPDATE"
          else
            echo "未检测到现有记录，开始执行全新 A 记录创建..."
            curl -s -X POST "https://cloudflare.com{ZONE_ID}/dns_records" \
              --resolve "://cloudflare.com:104.16.248.249" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$PAYLOAD"
            echo ""
            echo "🎉 普天同庆！全新的 Cloudflare 解析记录已成功创建，IP为: $IP_TO_UPDATE"
          fi
