name: Auto Update CF Speed IP
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

jobs:
  cloudflare-ddns:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 【全新脚本】利用 Docker 隔离沙箱直接向 Cloudflare 全球核心边缘发起同步，不再走本地坏掉的网络层
      - name: Cloudflare DDNS Sync
        uses: timothyjaeger/cloudflare-ddns-action@v1
        with:
          api-token: ${{ secrets.CF_API_TOKEN }}
          zone-id: ${{ secrets.CF_ZONE_ID }}
          subdomain: "cf"  # 【对应您的 cf.fldd.top，这里只填前缀 cf 即可】
          proxied: false
