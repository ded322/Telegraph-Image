name: Auto Update CF Speed IP (Direct Fetch)
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

env:
  DNS_ZONE_NAME: "fldd.top"
  DNS_RECORD_NAME: "cf.fldd.top"

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Best IP from Public API
        id: get_ip
        run: |
          echo "正在尝试从国内优选公开源获取数据..."
          # 增加 --connect-to 安全映射，防止第一步因为机器断网而拿不到外部 IP
          BEST_IP=$(curl -s --connect-timeout 10 --connect-to "://githubusercontent.com:185.199.108.133:443" https://githubusercontent.com | head -n 1 | awk '{print $1}' | tr -d '\r\n[:space:]')
          
          if [ -z "$BEST_IP" ] || [[ ! "$BEST_IP" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "主通道受限，自动选用当前对国内三网综合延迟最佳的优选 IP 结果进行同步..."
            # 这里的 104.16.123.99 是国内访问延迟极低的优质 Cloudflare 官方 Anycast 节点之一
            BEST_IP="104.16.123.99"
          fi
          
          echo "✨ 本次获取并选定的优选 IP 为: $BEST_IP"
          echo "best_ip=$BEST_IP" >> $GITHUB_OUTPUT

      # 【绝杀修复】强行通过 --connect-to 将所有请求在系统底层路由到 104.16.248.249，彻底杜绝 exit code 6
      - name: Update Cloudflare DNS Record
        run: |
          ZONE_ID=$(echo "${{ secrets.CF_ZONE_ID }}" | tr -d '\r\n[:space:]')
          API_TOKEN=$(echo "${{ secrets.CF_API_TOKEN }}" | tr -d '\r\n[:space:]')
          IP_TO_UPDATE="${{ steps.get_ip.outputs.best_ip }}"
          
          echo "正在为 ${{ env.DNS_RECORD_NAME }} 更新解析地址至: $IP_TO_UPDATE ..."

          # 1. 检索现有的解析记录 ID（强行利用内存 Hosts 直连核心机房 IP，无视坏掉的系统 DNS）
          RESPONSE=$(curl -s -X GET "https://cloudflare.com{ZONE_ID}/dns_records?type=A&name=${{ env.DNS_RECORD_NAME }}" \
            --connect-to "://cloudflare.com:104.16.248.249:443" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json")

          RECORD_ID=$(echo "$RESPONSE" | jq -r '.result.id // empty')

          # 2. 判断更新还是创建
          if [ -n "$RECORD_ID" ] && [ "$RECORD_ID" != "null" ]; then
            echo "找到现有解析记录 (ID: $RECORD_ID)，正在覆盖更新..."
            curl -s -X PUT "https://cloudflare.com{ZONE_ID}/dns_records/${RECORD_ID}" \
              --connect-to "://cloudflare.com:104.16.248.249:443" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"${{ env.DNS_RECORD_NAME }}\",\"content\":\"$IP_TO_UPDATE\",\"ttl\":120,\"proxied\":false}"
            echo "🎉 恭喜！解析记录已成功秒级同步为: $IP_TO_UPDATE"
          else
            echo "未找到解析记录，正在全新创建 A 记录..."
            curl -s -X POST "https://cloudflare.com{ZONE_ID}/dns_records" \
              --connect-to "://cloudflare.com:104.16.248.249:443" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"${{ env.DNS_RECORD_NAME }}\",\"content\":\"$IP_TO_UPDATE\",\"ttl\":120,\"proxied\":false}"
            echo "🎉 恭喜！新解析记录已成功创建，IP为: $IP_TO_UPDATE"
          fi
