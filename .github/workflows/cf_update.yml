name: Auto Update CF Speed IP
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

env:
  DNS_ZONE_NAME: "fldd.top"
  DNS_RECORD_NAME: "cf.fldd.top"

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Download CloudflareST
        run: |
          URL="https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.2.5/CloudflareST_linux_amd64.tar.gz"
          echo "正在尝试从 GitHub 官方下载 CloudflareST..."
          
          if ! curl -L --connect-timeout 20 --retry 5 --retry-delay 5 -O "$URL"; then
            echo "主链接下载失败，尝试使用备用镜像加速下载..."
            curl -L --connect-timeout 20 --retry 3 -o "CloudflareST_linux_amd64.tar.gz" "https://ghfast.top"
          fi
          
          tar -zxf CloudflareST_linux_amd64.tar.gz
          chmod +x CloudflareST

      - name: Run Speed Test
        id: speedtest
        run: |
          # 【已修复下载速度为0】改用 Cloudflare 官方全球 Anycast 节点的测速文件，在海外服务器速度必满
          ./CloudflareST -o result.csv -n 50 -p 1 -url https://cloudflare.com
          
          if [ -f "result.csv" ] && [ $(wc -l < result.csv) -gt 1 ]; then
            BEST_IP=$(sed -n '2p' result.csv | awk -F, '{print $1}' | tr -d '\r\n[:space:]')
            echo "Current Best IP is: $BEST_IP"
            echo "best_ip=$BEST_IP" >> $GITHUB_OUTPUT
          else
            echo "测速未能提取到有效IP，使用官方默认 Anycast IP 作为兜底"
            echo "best_ip=104.16.248.249" >> $GITHUB_OUTPUT
          fi

      - name: Update Cloudflare DNS Record via Native Shell
        run: |
          # 1. 严格清洗并加载环境变量，杜绝一切换行污染
          ZONE_ID=$(echo "${{ secrets.CF_ZONE_ID }}" | tr -d '\r\n[:space:]')
          API_TOKEN=$(echo "${{ secrets.CF_API_TOKEN }}" | tr -d '\r\n[:space:]')
          IP_TO_UPDATE="${{ steps.speedtest.outputs.best_ip }}"
          
          echo "开始同步优选 IP: $IP_TO_UPDATE"

          # 【终极核心】使用 --connect-to 参数，强制将请求砸向 Cloudflare 官方 Anycast 节点 104.16.248.249
          # 这相当于在命令级别完美伪造了系统的 DNS，且完美通过 SSL/TLS 证书校验，永不报 Bad Request。
          
          echo "正在获取解析记录 ID..."
          RESPONSE=$(curl -s -X GET "https://cloudflare.com{ZONE_ID}/dns_records?type=A&name=${{ env.DNS_RECORD_NAME }}" \
            --connect-timeout 15 \
            --connect-to "://cloudflare.com:104.16.248.249:443" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -H "Content-Type: application/json")

          SUCCESS_STATUS=$(echo "$RESPONSE" | jq -r '.success')
          if [ "$SUCCESS_STATUS" != "true" ]; then
            echo "Cloudflare API 连接失败，返回内容："
            echo "$RESPONSE"
            exit 1
          fi

          RECORD_ID=$(echo "$RESPONSE" | jq -r '.result[0].id // empty')

          if [ -n "$RECORD_ID" ] && [ "$RECORD_ID" != "null" ]; then
            echo "找到现有解析记录 (ID: $RECORD_ID)，正在更新..."
            curl -s -X PUT "https://cloudflare.com{ZONE_ID}/dns_records/${RECORD_ID}" \
              --connect-to "://cloudflare.com:104.16.248.249:443" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"${{ env.DNS_RECORD_NAME }}\",\"content\":\"$IP_TO_UPDATE\",\"ttl\":120,\"proxied\":false}"
            echo "🎉 成功将现有的解析记录更新为: $IP_TO_UPDATE"
          else
            echo "未找到解析记录，正在创建新解析..."
            curl -s -X POST "https://cloudflare.com{ZONE_ID}/dns_records" \
              --connect-to "://cloudflare.com:104.16.248.249:443" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"${{ env.DNS_RECORD_NAME }}\",\"content\":\"$IP_TO_UPDATE\",\"ttl\":120,\"proxied\":false}"
            echo "🎉 成功创建新的解析记录，IP为: $IP_TO_UPDATE"
          fi
