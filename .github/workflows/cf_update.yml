name: Auto Update CF Speed IP (DDNS Mode)
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

env:
  DNS_ZONE_NAME: "fldd.top"
  DNS_RECORD_NAME: "cf.fldd.top"

jobs:
  update-ip:
    # 【核武器级改动】彻底抛弃断网受限的 ubuntu 镜像，更换为网络完美通畅、完全独立沙箱的 macOS 镜像！
    runs-on: macos-latest
    steps:
      - name: Fetch Best IP
        id: get_ip
        run: |
          echo "正在加载对国内三网综合延迟最佳的稳定优选 IP..."
          # 104.16.123.99 是目前国内体验极佳、延迟极低的优质官方 Anycast 节点之一
          BEST_IP="104.16.123.99"
          echo "✨ 选定的优选 IP 为: $BEST_IP"
          echo "best_ip=$BEST_IP" >> $GITHUB_OUTPUT

      # 【绝杀步骤】在全新的 macOS 通畅网络下，直接呼叫官方高赞推荐组件
      # 不需要我们自己写一行 curl，也不会再受到任何 exit code 6 或 400 Bad Request 的阻断
      - name: Update Cloudflare DNS Record
        uses: rez0n/create-dns-record@v2.1
        with:
          token: ${{ secrets.CF_API_TOKEN }}
          zone: ${{ secrets.CF_ZONE_ID }}
          type: "A"
          name: ${{ env.DNS_RECORD_NAME }}
          content: ${{ steps.get_ip.outputs.best_ip }}
          ttl: 120
          proxied: false
