name: Auto Update CF Speed IP
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

env:
  DNS_ZONE_NAME: "fldd.top"
  DNS_RECORD_NAME: "cf.fldd.top"

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Download CloudflareST
        run: |
          URL="https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.2.5/CloudflareST_linux_amd64.tar.gz"
          echo "正在尝试从 GitHub 官方下载 CloudflareST..."
          
          if ! curl -L --connect-timeout 20 --retry 5 --retry-delay 5 -O "$URL"; then
            echo "主链接下载失败，尝试使用备用镜像加速下载..."
            curl -L --connect-timeout 20 --retry 3 -o "CloudflareST_linux_amd64.tar.gz" "https://ghfast.top"
          fi
          
          tar -zxf CloudflareST_linux_amd64.tar.gz
          chmod +x CloudflareST

      - name: Run Speed Test
        id: speedtest
        run: |
          # 使用 Cloudflare 官方全球节点的图标测速，确保速度不为 0
          ./CloudflareST -o result.csv -n 50 -p 1 -url https://cloudflare.com
          
          if [ -f "result.csv" ] && [ $(wc -l < result.csv) -gt 1 ]; then
            BEST_IP=$(sed -n '2p' result.csv | awk -F, '{print $1}' | tr -d '\r\n[:space:]')
            echo "Current Best IP is: $BEST_IP"
            echo "best_ip=$BEST_IP" >> $GITHUB_OUTPUT
          else
            echo "测速未能提取到有效IP，使用官方默认 Anycast IP 作为兜底"
            echo "best_ip=104.16.248.249" >> $GITHUB_OUTPUT
          fi

      # 【绝杀步骤】借用开源项目高度精简、高容错的 python 核心 API 脚本进行同步
      - name: Update DNS Record via Dedicated Tool
        shell: python
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE: ${{ secrets.CF_ZONE_ID }}
          BEST_IP: ${{ steps.speedtest.outputs.best_ip }}
        run: |
          import os, json, urllib.request

          # 1. 严格清洗并注入变量
          token = os.environ['CF_TOKEN'].strip()
          zone_id = os.environ['CF_ZONE'].strip()
          best_ip = os.environ['BEST_IP'].strip()
          record_name = "${{ env.DNS_RECORD_NAME }}".strip()

          print(f"开始同步优选 IP: {best_ip}")

          # 2. 下载或直接内嵌开源项目的标准安全请求函数
          # 该方法在底层通过标准 http 协议组包，能完美兼容各种极端限制的系统网络沙箱
          def call_cf_api(method, url_path, data=None):
              # 使用官方的标准 API 节点
              url = f"https://cloudflare.com{zone_id}{url_path}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
              req_body = json.dumps(data).encode('utf-8') if data else None
              req = urllib.request.Request(url, data=req_body, headers=headers, method=method)
              
              # 增加针对恶劣网络环境的全局跳过证书检查及重试策略，确保请求绝对能送达
              import ssl
              context = ssl._create_unverified_context()
              
              try:
                  with urllib.request.urlopen(req, context=context, timeout=15) as response:
                      return json.loads(response.read().decode('utf-8'))
              except Exception as e:
                  print(f"优先链路受限，正在启用内存级直连防封锁通道...")
                  # 如果域名无法解析，直接内存级别将流量砸向官方骨干 IP
                  alt_url = f"https://104.16.248{zone_id}{url_path}"
                  headers["Host"] = "://cloudflare.com"
                  req_alt = urllib.request.Request(alt_url, data=req_body, headers=headers, method=method)
                  with urllib.request.urlopen(req_alt, context=context, timeout=15) as response:
                      return json.loads(response.read().decode('utf-8'))

          try:
              # 3. 检索现有解析 A 记录
              res = call_cf_api("GET", f"/dns_records?type=A&name={record_name}")
              records = res.get("result", [])
              payload = {"type": "A", "name": record_name, "content": best_ip, "ttl": 120, "proxied": False}
              
              if records and len(records) > 0:
                  # 如果存在多条或单条，由于 result 是列表，先看它本身是字典还是列表
                  rec = records[0] if isinstance(records, list) else records
                  record_id = rec.get("id")
                  print(f"检测到已存在的解析记录，正在将其覆盖更新...")
                  final_res = call_cf_api("PUT", f"/dns_records/{record_id}", data=payload)
              else:
                  print("未检测到解析记录，正在为您全新创建 A 记录...")
                  final_res = call_cf_api("POST", "/dns_records", data=payload)

              if final_res.get("success"):
                  print(f"🎉 恭喜！Cloudflare DNS 解析已成功同步为: {best_ip}")
              else:
                  print(f"❌ 更新失败，Cloudflare 返回错误: {final_res.get('errors')}")
                  exit(1)
          except Exception as e:
              print(f"❌ 运行发生致命异常: {str(e)}")
              exit(1)
