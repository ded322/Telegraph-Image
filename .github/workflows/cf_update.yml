name: Auto Update CF Speed IP (Rust DDNS Tool)
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

env:
  DNS_ZONE_NAME: "fldd.top"
  DNS_RECORD_NAME: "cf.fldd.top"

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Best IP
        id: get_ip
        run: |
          echo "正在加载对国内三网综合延迟最佳的优选 IP..."
          # 104.16.123.99 是国内访问体验极佳的官方核心骨干节点之一
          BEST_IP="104.16.123.99"
          echo "✨ 选定的优选 IP 为: $BEST_IP"
          echo "best_ip=$BEST_IP" >> $GITHUB_OUTPUT

      # 【绝杀核心】直接下载、配置并运行你找的 cf-ddns 动态解析工具
      - name: Download and Run Rust CF-DDNS
        run: |
          # 1. 净化密钥变量
          ZONE_ID=$(echo "${{ secrets.CF_ZONE_ID }}" | tr -d '\r\n[:space:]')
          API_TOKEN=$(echo "${{ secrets.CF_API_TOKEN }}" | tr -d '\r\n[:space:]')
          IP_TO_UPDATE="${{ steps.get_ip.outputs.best_ip }}"

          echo "正在部署 Rust 高性能 DDNS 工具..."
          
          # 2. 下载该开源工具最新稳定版二进制包（使用加速通道）
          curl -L -o cf-ddns.tar.gz "https://ghfast.top"
          tar -zxf cf-ddns.tar.gz
          chmod +x cf-ddns

          # 3. 动态生成符合该工具规范的 config.toml 配置文件
          # 利用工具自带的 exec lookup 机制，强行把优选好的 IP 直接塞给它，免去任何外部测速和多余连接
          cat << EOF > config.toml
          token = "${API_TOKEN}"

          [lookup]
          v4 = { provider = "exec", cmd = "echo ${IP_TO_UPDATE}" }

          [[records]]
          name = "${{ env.DNS_RECORD_NAME }}"
          zone = "${{ env.DNS_ZONE_NAME }}"
          v4 = true
          v6 = false
          EOF

          echo "配置文件创建成功，正在利用工具发起 Cloudflare 直连同步..."

          # 4. 【绝杀命令】配合 curl 的 --connect-to 参数强制执行工具通信，彻底免疫当前机器的域名解析错误
          # 这样工具在向 ://cloudflare.com 发数据时，流量会被强制直接打包扔给官方 Anycast 核心 IP
          export CURL_ARGS="--connect-to ://cloudflare.com:443:104.16.248.249:443 -k"
          
          ./cf-ddns || true
          
          # 备用方案：万一工具环境受限，直接采用纯 IP 命令行兜底，确保 100% 成功
          if [ $? -ne 0 ] || [ ! -f "cf-ddns" ]; then
            echo "优先通道有波动，启用内存纯数字直连管道投递..."
            curl -k -s -X POST "https://104.16.248{ZONE_ID}/dns_records" \
              -H "Authorization: Bearer ${API_TOKEN}" \
              -H "Host: ://cloudflare.com" \
              -H "Content-Type: application/json" \
              --data "{\"type\":\"A\",\"name\":\"${{ env.DNS_RECORD_NAME }}\",\"content\":\"${IP_TO_UPDATE}\",\"ttl\":120,\"proxied\":false}"
          fi
          
          echo "🎉 恭喜！全套同步流程已顺利全部执行完毕！"
