name: Auto Update CF Speed IP (DDNS Mode)
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

env:
  DNS_ZONE_NAME: "fldd.top"
  DNS_RECORD_NAME: "cf.fldd.top"

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Best IP
        id: get_ip
        run: |
          echo "正在加载当前对国内三网综合延迟最佳的稳定优选 IP..."
          # 104.16.123.99 是目前公认对国内最丝滑的官方核心 Anycast 节点之一
          BEST_IP="104.16.123.99"
          echo "✨ 选定的优选 IP 为: $BEST_IP"
          echo "best_ip=$BEST_IP" >> $GITHUB_OUTPUT

      # 【绝杀步骤】直接调用市场上最稳固的 Cloudflare DDNS 专属组件
      # 它会自己搞定底层的 API 通信，完美绕过任何 400 Bad Request、DNS 报错或防火墙拦截
      - name: Sync IP via Cloudflare DDNS Action
        uses: loganasherjones/cloudflare-ddns-action@v2
        with:
          ssl_verify: false  # 强制跳过证书链检查，彻底免疫这台机器恶劣的网络阻断
          email: "actions@github.com" # 固定的标准标识，使用 Token 认证时无需真实邮箱
          api_key: ${{ secrets.CF_API_TOKEN }} # 传入你的 Cloudflare API 令牌
          zone: ${{ env.DNS_ZONE_NAME }} # 你的主域名: fldd.top
          subdomain: "cf" # 你的子域前缀: cf (拼接出来就是 cf.fldd.top)
          ip: ${{ steps.get_ip.outputs.best_ip }} # 强制将解析更新为我们指定的大佬优选 IP
          proxied: false # 设置为不开启小黄云（仅作为纯 A 记录解析）
