name: Auto Update CF Speed IP
on:
  workflow_dispatch: # 允许在网页上点击按钮手动运行
  schedule:
    - cron: '0 */2 * * *' # 每2小时自动定时运行一次

env:
  DNS_ZONE_NAME: "fldd.top"
  DNS_RECORD_NAME: "cf.fldd.top"

jobs:
  update-ip:
    runs-on: ubuntu-latest
    steps:
      - name: Download CloudflareST
        run: |
          URL="https://github.com/XIU2/CloudflareSpeedTest/releases/download/v2.2.5/CloudflareST_linux_amd64.tar.gz"
          echo "正在尝试从 GitHub 官方下载 CloudflareST..."
          
          if ! curl -L --connect-timeout 20 --retry 5 --retry-delay 5 -O "$URL"; then
            echo "主链接下载失败，尝试使用备用镜像加速下载..."
            curl -L --connect-timeout 20 --retry 3 -o "CloudflareST_linux_amd64.tar.gz" "https://ghfast.top"
          fi
          
          tar -zxf CloudflareST_linux_amd64.tar.gz
          chmod +x CloudflareST

      - name: Run Speed Test
        id: speedtest
        run: |
          ./CloudflareST -o result.csv -n 100 -p 1 -url https://v2ex.co
          
          if [ -f "result.csv" ] && [ $(wc -l < result.csv) -gt 1 ]; then
            BEST_IP=$(sed -n '2p' result.csv | awk -F, '{print $1}' | tr -d '\r\n[:space:]')
            echo "Current Best IP is: $BEST_IP"
            echo "best_ip=$BEST_IP" >> $GITHUB_OUTPUT
          else
            echo "测速未能提取到有效IP，可能是网络连接断开"
            exit 1
          fi

      # 【绝杀步骤】直接用 Python 在内存中修改 ://cloudflare.com 的路由映射，完全无视系统 DNS
      - name: Update Cloudflare DNS Record via Python
        shell: python
        env:
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE: ${{ secrets.CF_ZONE_ID }}
          BEST_IP: ${{ steps.speedtest.outputs.best_ip }}
        run: |
          import os, json, urllib.request, socket

          # 1. 严格清洗并加载环境变量
          token = os.environ['CF_TOKEN'].strip()
          zone_id = os.environ['CF_ZONE'].strip()
          best_ip = os.environ['BEST_IP'].strip()
          record_name = "${{ env.DNS_RECORD_NAME }}".strip()

          print(f"正在为 {record_name} 同步优选 IP: {best_ip}")

          # ==================== 黑科技：DNS 内存劫持核心 ====================
          # 强行让系统在遇到 ://cloudflare.com 时，直接返回官方高可用 IP，完全不向恶劣的宿主机 DNS 提问！
          original_getaddrinfo = socket.getaddrinfo
          def hacked_getaddrinfo(host, port, family=0, type=0, proto=0, flags=0):
              if host == '://cloudflare.com':
                  # 172.65.11.249 是 Cloudflare 官方 API 服务的 Anycast IP
                  return [(socket.AF_INET, socket.SOCK_STREAM, 6, '', ('172.65.11.249', port))]
              return original_getaddrinfo(host, port, family, type, proto, flags)
          socket.getaddrinfo = hacked_getaddrinfo
          # ================================================================

          # 2. 查询现有的 DNS 记录 ID
          get_url = f"https://://cloudflare.com/client/v4/zones/{zone_id}/dns_records?type=A&name={record_name}"
          req = urllib.request.Request(get_url, headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})
          
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  res_data = json.loads(response.read().decode())
              
              records = res_data.get("result", [])
              payload = {"type": "A", "name": record_name, "content": best_ip, "ttl": 120, "proxied": False}
              
              if records and len(records) > 0:
                  record_id = records[0]["id"]
                  print(f"找到现有解析记录 (ID: {record_id})，正在执行覆盖更新...")
                  put_url = f"https://://cloudflare.com/client/v4/zones/{zone_id}/dns_records/{record_id}"
                  req_update = urllib.request.Request(put_url, data=json.dumps(payload).encode(), headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}, method="PUT")
              else:
                  print("未找到解析记录，正在创建新解析...")
                  post_url = f"https://://cloudflare.com/client/v4/zones/{zone_id}/dns_records"
                  req_update = urllib.request.Request(post_url, data=json.dumps(payload).encode(), headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}, method="POST")
              
              with urllib.request.urlopen(req_update, timeout=30) as response_update:
                  final_res = json.loads(response_update.read().decode())
              
              if final_res.get("success"):
                  print(f"🎉 恭喜！Cloudflare DNS 解析已成功同步为: {best_ip}")
              else:
                  print(f"❌ 更新失败，Cloudflare 返回错误: {final_res.get('errors')}")
                  exit(1)
                  
          except Exception as e:
              print(f"❌ 脚本执行发生异常: {str(e)}")
              exit(1)
